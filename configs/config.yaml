# Example configuration. Everything is commented out: defaults apply.
# Precedence: environment variables > this file > built-in defaults.
#
# Env overrides: PORT, GRPC_PORT, LOG_LEVEL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

# port: 8080                # HTTP listen port
# grpc_port: 50051          # gRPC listen port
# log_level: info           # debug | info | warn | error
# supabase_url: ""          # set BOTH to switch storage from memory to PostgREST
# supabase_service_key: ""  # service-role key; never expose to browsers
